<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mufy 阅读器</title>
<style>
/* 「报纸」皮想用京華老宋体的话，把它的 ttf 改名成 kinghwa.ttf 放在本文件旁边即可。
   本仓不附带字体（不代第三方字体做分发）；没有就自动退到思源宋 / 系统宋，功能不受影响。 */
@font-face{
  font-family:'KingHwaOldSong';
  src:local('京華老宋体_KingHwa_OldSong'), local('京華老宋体'), url('kinghwa.ttf') format('truetype');
  font-weight:200 400; font-display:swap;
}
/* 这三款本仓不附带字体文件（不代第三方字体做分发）。
   你自己系统里装了同名字体就会自动用上，没装就退到后面的系统字，功能不受影响。 */
@font-face{
  font-family:'ZcoolXiaoWei';
  src:local('ZCOOL XiaoWei'), local('站酷小薇');
  font-display:swap;
}
@font-face{
  font-family:'ZcoolQingKe';
  src:local('ZCOOL QingKe HuangYou'), local('站酷庆科黄油体');
  font-display:swap;
}
@font-face{                                   /* 朝華，B 是秀丽克制的那支，适合正文 */
  font-family:'ChaohuaB';
  src:local('朝華標題明朝體B'), local('ChaohuaB');
  font-display:swap;
}
:root{
  --bg:#17120e; --bg2:#1f1811; --ink:#efe4d4; --dim:#c3b39a; --faint:#8b7d6b;
  --glow:#e8a94e; --line:rgba(232,169,78,.16); --panel:rgba(31,24,17,.72);
  --serif:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --fs:19px; --lh:2.0; --cw:720px;
}
:root[data-theme=day]{
  --bg:#f4ece0; --bg2:#fbf6ee; --ink:#2e2621; --dim:#5f5346; --faint:#938473;
  --glow:#a9712a; --line:rgba(169,113,42,.2); --panel:rgba(251,246,238,.8);
}
:root[data-theme=grey]{
  --bg:#22242a; --bg2:#2a2d34; --ink:#dfe3e9; --dim:#aeb5bf; --faint:#7e8590;
  --glow:#7fa6d0; --line:rgba(127,166,208,.18); --panel:rgba(42,45,52,.75);
}
/* ── 护眼向的几套 ──
   共同点：底色不用纯白（白底黑字对比过强，久读发涩），字色不用纯黑，
   两者的明度差控制在「看得清但不刺」的区间。 */
:root[data-theme=bean]{        /* 豆沙绿：最经典的一套，白天久读用这个 */
  --bg:#cfe0cd; --bg2:#d9e7d7; --ink:#2b332b; --dim:#4f5a4e; --faint:#7c877a;
  --glow:#4a7a52; --line:rgba(74,122,82,.22); --panel:rgba(217,231,215,.86);
}
:root[data-theme=parch]{       /* 羊皮纸：比「昼」更黄更暖，夜里开小灯不刺眼 */
  --bg:#e9dcc0; --bg2:#f1e7d2; --ink:#3a2f22; --dim:#63533f; --faint:#8e7c63;
  --glow:#9a6b28; --line:rgba(154,107,40,.22); --panel:rgba(241,231,210,.86);
}
:root[data-theme=mist]{        /* 冷灰蓝：低对比，阴天和傍晚很舒服 */
  --bg:#dde3e8; --bg2:#e7ecf0; --ink:#2f3740; --dim:#556069; --faint:#828d97;
  --glow:#3f6d94; --line:rgba(63,109,148,.2); --panel:rgba(231,236,240,.88);
}
:root[data-theme=oled]{        /* 纯黑：深夜关灯用，底接近全黑、字压到柔和的米 */
  --bg:#000; --bg2:#0b0b0c; --ink:#d6d0c6; --dim:#9c968c; --faint:#6b665e;
  --glow:#c9a063; --line:rgba(201,160,99,.16); --panel:rgba(11,11,12,.86);
}

/* 「白」：偏灰的纸面配色 */
:root[data-theme=paper]{
  --bg:#eaeae9; --bg2:#e6e6e6; --ink:#000; --dim:#4a4a4a; --faint:#8a8a8a;
  --glow:#c7710c; --line:rgba(200,200,200,1); --panel:rgba(245,245,245,.94);
  --serif:'KingHwaOldSong','京華老宋体',serif;
  --quote:rgba(199,113,12,.81); --ital:rgba(185,32,11,.84); --under:rgba(19,72,121,.68);
}
/* 「白」皮：正文纸面 + 极淡纸纹 */
:root[data-theme=paper] body{
  background-image:
    radial-gradient(circle at 17% 23%, rgba(0,0,0,.022) 0 1px, transparent 1px),
    radial-gradient(circle at 63% 71%, rgba(0,0,0,.018) 0 1px, transparent 1px),
    radial-gradient(circle at 88% 41%, rgba(0,0,0,.02) 0 1px, transparent 1px);
  background-size: 37px 37px, 53px 53px, 29px 29px;
}
:root[data-theme=paper] #page{background:rgba(255,255,255,.57);border-radius:2px}
:root[data-theme=paper] .msg.ta{background:#f5f5f5;border:1px solid var(--line);
  border-radius:3px;padding:18px 22px}
:root[data-theme=paper] .msg.me .body{background:#e6e6e6;border-left:3px solid #b8b8b8;
  padding:12px 16px;color:#333}
:root[data-theme=paper] .body{font-weight:300}
/* 报纸皮下让 RP 里的引号/破折号有颜色，像原来那套主题 */
:root[data-theme=paper] .q{color:var(--quote)}
:root[data-theme=paper] .i{color:var(--ital);font-style:italic}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);
     display:flex;overflow:hidden;transition:background .4s ease,color .4s ease}

/* ── 侧栏 ── */
#side{width:312px;flex:none;height:100%;display:flex;flex-direction:column;
      background:var(--bg2);border-right:1px solid var(--line);transition:margin-left .3s ease}
#side.hide{margin-left:-312px}
#side header{padding:20px 18px 12px;border-bottom:1px solid var(--line)}
#side h1{margin:0 0 3px;font-size:15px;font-weight:500;letter-spacing:.16em;color:var(--glow)}
#side .sub{font-size:11.5px;color:var(--faint);letter-spacing:.08em}
#pick{margin-top:13px;width:100%;padding:9px;border-radius:11px;cursor:pointer;font-family:inherit;
      font-size:13px;background:rgba(232,169,78,.12);color:var(--ink);border:1px solid var(--line)}
#pick:hover,#pick2:hover{background:rgba(232,169,78,.2)}
#pick2{width:100%;padding:7px;border-radius:10px;cursor:pointer;font-family:inherit;
       font-size:12px;background:transparent;color:var(--dim);border:1px solid var(--line)}
#diag{margin-top:9px;font-size:11.5px;line-height:1.7;color:var(--faint)}
#q{margin:12px 18px 0;padding:7px 11px;border-radius:10px;font-family:inherit;font-size:13px;
   background:rgba(0,0,0,.16);color:var(--ink);border:1px solid var(--line);outline:none}
:root[data-theme=day] #q{background:rgba(0,0,0,.05)}
#list{flex:1;overflow-y:auto;padding:10px 10px 40px}
.ch{padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--dim);
    display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ch:hover{background:rgba(232,169,78,.08);color:var(--ink)}
.ch.on{background:rgba(232,169,78,.13);color:var(--glow)}
.ch .n{font-size:11px;color:var(--faint);flex:none}
.caps{padding:2px 0 8px 8px}
.cap{padding:6px 10px 6px 16px;border-left:1px solid var(--line);margin-left:6px;
     font-size:12.8px;color:var(--faint);cursor:pointer;line-height:1.55}
.cap:hover{color:var(--ink)}
.cap.on{color:var(--glow);border-left-color:var(--glow)}
.cap .m{font-size:10.5px;opacity:.65;margin-left:6px}

/* ── 正文 ── */
#main{flex:1;height:100%;overflow-y:auto;position:relative;scroll-behavior:smooth}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
     padding:11px 22px;background:var(--panel);backdrop-filter:blur(16px);
     border-bottom:1px solid var(--line);font-size:12.5px;color:var(--faint)}
#bar .t{flex:1;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
            padding:4px 10px;font-family:inherit;font-size:12px;cursor:pointer}
#bar button:hover{color:var(--glow);border-color:var(--glow)}
#bar select{background:var(--bg2);color:var(--dim);border:1px solid var(--line);border-radius:8px;
            padding:4px 6px;font-family:inherit;font-size:12px}
#page{max-width:var(--cw);margin:0 auto;padding:52px 32px 140px}
#page h2{font-size:23px;font-weight:500;letter-spacing:.05em;margin:0 0 6px;color:var(--ink)}
#page .meta{font-size:12px;color:var(--faint);letter-spacing:.06em;margin-bottom:44px;
            padding-bottom:18px;border-bottom:1px solid var(--line)}
.msg{margin:0 0 34px}
.who{font-size:11.5px;letter-spacing:.18em;color:var(--faint);margin-bottom:9px}
.msg.me .who{color:var(--glow);opacity:.72}
.body{font-size:var(--fs);line-height:var(--lh);white-space:pre-wrap;word-break:break-word}
.msg.me .body{color:var(--dim);font-size:calc(var(--fs) - 1.5px);
              border-left:2px solid var(--line);padding-left:18px}
:root[data-hideme="1"] .msg.me{display:none}  /* ⚠️ 这个 "1" 必须带引号：CSS 属性选择器的值只能是标识符或字符串，而标识符不能以数字开头。写成 [data-hideme=1] 整条规则会被解析器直接丢掉——按钮照点、属性照设、文字照变，就是不生效（真踩过，用户报「点了完全没反应」）。 */
#nav{max-width:var(--cw);margin:0 auto;padding:0 32px 90px;display:flex;gap:12px}
/* 一键回顶 / 回底：内容够长时才出现，固定在右下角，手机上也够得着。
   #main 已经是 scroll-behavior:smooth，所以是滑过去的，不是瞬移。 */
#jumpers{position:fixed;right:18px;bottom:22px;z-index:30;display:none;flex-direction:column;gap:8px}
#jumpers.on{display:flex}
#jumpers button{width:38px;height:38px;border-radius:12px;cursor:pointer;
  background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
  color:var(--dim);font:inherit;font-size:15px;line-height:1;padding:0}
#jumpers button:hover{color:var(--glow);border-color:var(--glow)}
@media (max-width:760px){#jumpers{right:12px;bottom:14px}
  #jumpers button{width:42px;height:42px}}
#pgind{flex:0 0 auto;align-self:center;color:var(--faint);font-size:12.5px;letter-spacing:.05em;
  min-width:72px;text-align:center;user-select:none}
/* 跳页输入框：长得像页码本身，不要像个表单控件。数字上下箭头也去掉。 */
#pgind input{width:3.4em;padding:2px 4px;margin:0 2px;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font:inherit;text-align:center;-moz-appearance:textfield}
#pgind input::-webkit-outer-spin-button,#pgind input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#pgind input:focus{outline:none;border-color:var(--ink)}
#nav button{flex:1;padding:13px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13.5px;
            background:rgba(232,169,78,.08);color:var(--dim);border:1px solid var(--line)}
#nav button:hover:not(:disabled){color:var(--glow);border-color:var(--glow)}
#nav button:disabled{opacity:.3;cursor:default}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       text-align:center;color:var(--faint);font-size:14px;line-height:2.1;padding:40px}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:20;
       background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
       border-radius:12px;padding:9px 18px;font-size:12.5px;color:var(--dim);
       opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<aside id="side">
  <header>
    <h1>MUFY 阅读器</h1>
    <div class="sub">把导出的存档当小说翻</div>
    <button id="pick">选择存档文件夹</button>
    <button id="pick2" style="margin-top:7px">或直接选 zip 文件（可多选）</button>
    <div id="diag"></div>
    <input id="dir" type="file" webkitdirectory directory multiple hidden>
    <input id="zips" type="file" accept=".zip,application/zip" multiple hidden>
  </header>
  <input id="q" placeholder="搜角色名…">
  <div id="list"></div>
</aside>

<main id="main">
  <div id="bar">
    <button id="toggle" title="收起目录">☰</button>
    <span class="t" id="title">还没打开任何存档</span>
    <button data-fs="-1">A−</button>
    <button data-fs="1">A+</button>
    <select id="lh"><option value="1.8">行距紧</option><option value="2.0" selected>行距中</option><option value="2.3">行距松</option></select>
    <select id="cw"><option value="620">窄</option><option value="720" selected>中</option><option value="880">宽</option></select>
    <select id="ff" title="字体要你的设备里装了才生效。手机上多数只有系统自带那几款（苹方/宋体/楷体/黑体）能切得动">
      <option value="'KingHwaOldSong','京華老宋体',serif" selected>京華老宋</option>
      <option value="'ZcoolXiaoWei','ZCOOL XiaoWei',serif">站酷小薇</option>
      <option value="'ChaohuaB','Songti SC','SimSun',serif">朝華正文</option>
      <option value='"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif'>系统宋（手机可用）</option>
      <option value='"PingFang SC","苹方","Noto Sans CJK SC","Microsoft YaHei",sans-serif'>系统黑（手机可用）</option>
      <option value='"Kaiti SC","STKaiti","楷体",serif'>系统楷（手机可用）</option>
      <option value="'ZcoolQingKe','ZCOOL QingKe HuangYou',sans-serif">庆科黄油</option>
      <option value='"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif'>思源宋</option>
      <option value='"KaiTi","STKaiti","Kaiti SC","楷体",serif'>楷体</option>
      <option value='"FangSong","STFangsong","仿宋",serif'>仿宋</option>
      <option value='"STSong","SimSun","Songti SC","宋体",serif'>宋体</option>
      <option value='"Microsoft YaHei","微软雅黑","PingFang SC","Noto Sans CJK SC",sans-serif'>雅黑</option>
      <option value='"DengXian","等线","PingFang SC",sans-serif'>等线</option>
    </select>
    <select id="th">
      <option value="paper" selected>白</option>
      <option value="bean">豆沙绿</option>
      <option value="parch">羊皮纸</option>
      <option value="mist">冷灰蓝</option>
      <option value="day">昼</option>
      <option value="grey">灰</option>
      <option value="night">夜</option>
      <option value="oled">纯黑</option>
    </select>
    <select id="pg" title="长存档是一页页翻，还是一路往下滑">
      <option value="page" selected>分页</option>
      <option value="scroll">滚动</option>
    </select>
    <select id="ps" title="一页大约多少字（只在分页模式下有用）">
      <option value="short">页短</option>
      <option value="mid" selected>页中</option>
      <option value="long">页长</option>
    </select>
    <button id="hideme" title="RP 记录里你的发言常常是指令，藏起来更像读小说">隐藏我的发言</button>
    <button id="hidesys" title="记忆区的「规则：…」「AI填充：…」是给模型看的脚手架，不是正文">已藏脚手架</button>
  </div>

  <div id="page"></div>
  <div id="jumpers">
    <button id="toTop" title="回到顶部（Home）">↑</button>
    <button id="toEnd" title="到最底部（End）">↓</button>
  </div>
  <div id="nav">
    <button id="prev" disabled>← 上一段</button>
    <span id="pgind"></span>
    <button id="next" disabled>下一段 →</button>
  </div>

  <div id="empty">
    点左上角「选择存档文件夹」<br>
    选中你放导出 zip 的那个文件夹<br><br>
    <span style="opacity:.7">
    不用解压，它直接读 zip；一次只把一个角色读进内存。<br>
    键盘 ← → 翻章，Esc 收起目录。<br><br>
    ⚠️ 别选云盘目录（WPS／OneDrive）——里面是占位文件，浏览器读不到，<br>
    会显示「一个 zip 都没有」。先把文件夹复制到本地硬盘。
    </span>
  </div>
</main>

<div id="toast"></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════
   ZIP 读取：只读需要的字节区间，不整包载入。
   （导出脚本那边的 ZIP 是我自己按格式拼的，这里是它的逆运算。）
   ══════════════════════════════════════════════════════════ */

const td = new TextDecoder('utf-8');

async function readSlice(file, start, len) {
  return new Uint8Array(await file.slice(start, start + len).arrayBuffer());
}
const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;

// 从尾部倒着找 EOCD（0x06054b50）
async function centralDir(file) {
  const tail = Math.min(file.size, 66000);
  const b = await readSlice(file, file.size - tail, tail);
  let p = -1;
  for (let i = b.length - 22; i >= 0; i--) {
    if (u32(b, i) === 0x06054b50) { p = i; break; }
  }
  if (p < 0) throw new Error('不是有效的 zip（找不到目录尾）');
  const count = u16(b, p + 10), size = u32(b, p + 12), off = u32(b, p + 16);
  const cd = await readSlice(file, off, size);
  const entries = new Map();
  let q = 0;
  for (let i = 0; i < count; i++) {
    if (u32(cd, q) !== 0x02014b50) break;
    const method = u16(cd, q + 10);
    const csize = u32(cd, q + 20), usize = u32(cd, q + 24);
    const nLen = u16(cd, q + 28), eLen = u16(cd, q + 30), cLen = u16(cd, q + 32);
    const local = u32(cd, q + 42);
    const name = td.decode(cd.subarray(q + 46, q + 46 + nLen));
    entries.set(name, { method, csize, usize, local });
    q += 46 + nLen + eLen + cLen;
  }
  return entries;
}

async function readEntry(file, e) {
  // 本地头长度不固定，得先读它的 nameLen / extraLen
  const lh = await readSlice(file, e.local, 30);
  if (u32(lh, 0) !== 0x04034b50) throw new Error('本地文件头损坏');
  const dataAt = e.local + 30 + u16(lh, 26) + u16(lh, 28);
  const raw = await readSlice(file, dataAt, e.csize);
  if (e.method === 0) return td.decode(raw);
  if (e.method !== 8) throw new Error('不支持的压缩方式 ' + e.method);
  const ds = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return td.decode(new Uint8Array(await new Response(ds).arrayBuffer()));
}

/* ══════════════════════════════════════════════════════════
   缓存：把解析结果存进 IndexedDB，第二次打开就不用再选文件。
   存的是压缩后的 JSON，体量和 zip 差不多（百来 MB 量级）。
   ══════════════════════════════════════════════════════════ */

const DB_NAME = 'mufyReader', DB_VER = 1;
let _db = null;

function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('packs')) d.createObjectStore('packs');
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}

function idbDo(store, mode, fn) {
  return idb().then(d => new Promise((res, rej) => {
    const tx = d.transaction(store, mode);
    const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = () => rej(tx.error);
  }));
}

const idbGet = (s, k) => idbDo(s, 'readonly', o => o.get(k));
const idbPut = (s, k, v) => idbDo(s, 'readwrite', o => o.put(v, k));
const idbKeys = (s) => idbDo(s, 'readonly', o => o.getAllKeys());
const idbClear = (s) => idbDo(s, 'readwrite', o => o.clear());

async function zipText(t) {
  const s = new Blob([t]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzipText(b) {
  const s = new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return td.decode(new Uint8Array(await new Response(s).arrayBuffer()));
}

/* ══════════════════════════════════════════════════════════
   内容处理
   ══════════════════════════════════════════════════════════ */

function contentToText(c) {
  if (typeof c === 'string') return c;
  if (!Array.isArray(c)) return c == null ? '' : JSON.stringify(c);
  return c.map(p => {
    if (p == null) return '';
    if (typeof p === 'string') return p;
    if (p.type === 'text' || typeof p.text === 'string') return p.text || '';
    if (p.url) return '［图片］';
    return '';
  }).join('\n');
}

// 状态栏 HTML 和 think 块对「读小说」是噪音，读的时候清掉。
// 注意：去掉标签之后还要收拾 HTML 缩进带出来的行首空白，
// 否则状态栏那一块会在正文里裂出好几行空档。
function tidy(t) {
  return String(t)
    .replace(/<think>[\s\S]*?<\/think>/g, '')
    .replace(/<!--[\s\S]*?-->/g, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<[^>]+>/g, '')
    .replace(/[ \t]+$/gm, '')
    .replace(/^[ \t]+/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

// 卡里给模型看的脚手架（记忆区规则、待填充占位）——读小说时是纯噪音。
// 只删「明确是指令」的行，不碰剧情；关掉开关就能看到完整原文。
const MACHINERY = /\[\s*(规则|AI\s*填充)\s*[:：]|待生成|【\s*规则\s*】/;
function dropMachinery(t) {
  return t.split('\n')
    .filter(l => !MACHINERY.test(l))
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
// 数一数这一段里有多少行会被藏掉 —— 用同一条判据，免得「说藏了 N 行」和实际删的对不上
function countMachinery(t) {
  let n = 0;
  for (const l of t.split('\n')) if (MACHINERY.test(l)) n += 1;
  return n;
}

const esc = s => String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));

const S = { chars: [], cur: -1, pack: null, cap: -1, page: 0, mode: 'page' };
const $ = id => document.getElementById(id);

function toast(msg, ms = 1800) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}

// mufy_角色名_20260807-0114.zip  /  mufy_角色名_1562d9_20260807-0114.zip
function parseName(fn) {
  const m = fn.match(/^mufy_(.+?)(?:_([0-9a-f]{6}))?_(\d{8}-\d{4})\.zip$/i);
  if (!m) return { name: fn.replace(/\.zip$/i, ''), id: '', batch: '' };
  return { name: m[1], id: m[2] || '', batch: m[3] };
}

$('pick').onclick = () => $('dir').click();
$('pick2').onclick = () => $('zips').click();

function accept(fileList) {
  const all = [...fileList];
  const zips = all.filter(f => /\.zip$/i.test(f.name));
  // ⚠️ 云盘（WPS / OneDrive）里的文件是「占位文件」，浏览器枚举不到。
  //    枚举总数和 zip 数都报出来，出问题时一眼看得见是哪一步丢的。
  const d = $('diag');
  if (!zips.length) {
    d.textContent = all.length
      ? `选中了 ${all.length} 个文件，但一个 zip 都没有。若这是云盘目录（WPS／OneDrive），
         里面多半是占位文件，浏览器读不到——把文件夹复制到本地硬盘再选。`
      : '一个文件都没读到。若这是云盘目录，请先复制到本地硬盘。';
    toast('没读到 zip，看左侧说明', 4200);
    return;
  }
  d.textContent = `已载入 ${zips.length} 个包` + (all.length > zips.length ? `（另跳过 ${all.length - zips.length} 个非 zip）` : '');
  S.chars = zips.map(f => ({ file: f, key: f.name, ...parseName(f.name) }))
    .sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  S.cur = -1; S.pack = null; S.cap = -1;
  renderList();
  $('empty').style.display = 'none';
  toast(`读到 ${S.chars.length} 个角色`);
  buildCache();          // 存一份进浏览器，下次开就不用再选文件
}

/* 一个一个来，绝不并发——这台机器被并发烤过一次。 */
async function buildCache() {
  const d = $('diag');
  let done = 0, bytes = 0, fail = 0;
  for (const c of S.chars) {
    try {
      const entries = await centralDir(c.file);
      const key = [...entries.keys()].find(k => k === '_原始数据.json')
               || [...entries.keys()].find(k => k.endsWith('.json'));
      if (!key) { fail++; continue; }
      const json = await readEntry(c.file, entries.get(key));
      const packed = await zipText(json);
      await idbPut('packs', c.key, packed);
      bytes += packed.length;
      done++;
    } catch (e) { fail++; }
    if (done % 3 === 0 || done === S.chars.length) {
      d.textContent = `缓存中 ${done}/${S.chars.length}　${(bytes / 1048576).toFixed(0)} MB`;
      await new Promise(r => setTimeout(r, 0));   // 让出主线程，界面不卡
    }
  }
  await idbPut('kv', 'index', S.chars.map(c => ({
    key: c.key, name: c.name, id: c.id, batch: c.batch, size: c.file.size,
  })));
  await idbPut('kv', 'savedAt', Date.now());
  d.innerHTML = `已缓存 ${done} 个角色　${(bytes / 1048576).toFixed(0)} MB`
    + (fail ? `（${fail} 个失败）` : '')
    + `<br><span id="clearcache" style="cursor:pointer;text-decoration:underline">清除缓存</span>`;
  const cc = $('clearcache');
  if (cc) cc.onclick = async () => {
    await idbClear('packs'); await idbClear('kv');
    d.textContent = '缓存已清除，下次打开需要重新选文件夹。';
    toast('缓存已清除');
  };
}

/* 开机：能从缓存起就从缓存起，一个文件都不用选 */
async function bootFromCache() {
  try {
    const idx = await idbGet('kv', 'index');
    if (!idx || !idx.length) return false;
    S.chars = idx.map(c => ({ ...c, file: null, cached: true }));
    const keys = await idbKeys('packs');
    renderList();
    $('empty').style.display = 'none';
    const at = await idbGet('kv', 'savedAt');
    $('diag').innerHTML = `从缓存载入 ${S.chars.length} 个角色`
      + (at ? `　<span style="opacity:.7">${new Date(at).toLocaleDateString('zh-CN')}</span>` : '')
      + `<br><span id="clearcache" style="cursor:pointer;text-decoration:underline">清除缓存</span>`;
    const cc = $('clearcache');
    if (cc) cc.onclick = async () => {
      await idbClear('packs'); await idbClear('kv');
      location.reload();
    };
    toast(`从缓存载入 ${keys.length} 个角色，不用选文件`);
    return true;
  } catch (e) { return false; }
}

$('dir').onchange = e => accept(e.target.files);
$('zips').onchange = e => accept(e.target.files);

function renderList() {
  const kw = $('q').value.trim().toLowerCase();
  const box = $('list'); box.innerHTML = '';
  S.chars.forEach((c, i) => {
    if (kw && !c.name.toLowerCase().includes(kw)) return;
    const d = document.createElement('div');
    d.className = 'ch' + (i === S.cur ? ' on' : '');
    d.innerHTML = `<span>${esc(c.name)}${c.id ? ` <span class="n">#${c.id}</span>` : ''}</span>
                   <span class="n">${(((c.file && c.file.size) || c.size || 0) / 1048576).toFixed(1)}M</span>`;
    d.onclick = () => openChar(i);
    box.appendChild(d);
    if (i === S.cur && S.pack) {
      const caps = document.createElement('div');
      caps.className = 'caps';
      S.pack.sessions.forEach((s, j) => {
        const el = document.createElement('div');
        el.className = 'cap' + (j === S.cap ? ' on' : '');
        el.innerHTML = `${esc(capTitle(s, j))}<span class="m">${s.messageCount}条</span>`;
        el.onclick = ev => { ev.stopPropagation(); openCap(j); };
        caps.appendChild(el);
      });
      box.appendChild(caps);
    }
  });
}
$('q').oninput = renderList;

function capTitle(s, j) {
  if (s.isGreeting) return '开场白';
  // 当前对话（未存档）没有备注，退到 AI 首行又常被日期正则削得只剩「/17:15」这种残句，
  // 真有用户把它当成一个不存在的存档 —— 直接点名它是什么。
  if (s.isCurrent) return `${j + 1}. 当前对话（未存档）`;
  const remark = (s.archives || []).map(a => a.remark).filter(Boolean).join(' / ');
  if (remark) return `${j + 1}. ${remark}`;
  const first = (s.dialogs || []).find(m => m.role === 'assistant' && tidy(contentToText(m.content)));
  if (first) {
    const line = tidy(contentToText(first.content)).split('\n').find(x => x.trim()) || '';
    const cut = line.replace(/^\s*\d{4}[/\-.]\d{1,2}[/\-.]\d{1,2}(?:[/\s]\d{1,2}[:：]\d{2})?\s*[•·・\-—|]*\s*/, '');
    if (cut) return `${j + 1}. ${cut.slice(0, 22)}`;
  }
  return `${j + 1}. 第 ${j + 1} 段`;
}

async function openChar(i) {
  const c = S.chars[i];
  $('title').textContent = c.name + ' · 读取中…';
  try {
    let json = null;
    // 缓存优先：有缓存就不碰文件，没缓存再回去读 zip
    const cached = await idbGet('packs', c.key).catch(() => null);
    if (cached) {
      json = await unzipText(cached);
    } else if (c.file) {
      const entries = await centralDir(c.file);
      const key = [...entries.keys()].find(k => k === '_原始数据.json') ||
                  [...entries.keys()].find(k => k.endsWith('.json'));
      if (!key) throw new Error('这个包里没有 _原始数据.json（可能是旧版导出）');
      json = await readEntry(c.file, entries.get(key));
    } else {
      throw new Error('这个角色不在缓存里，也没选到对应的 zip。请重新选一次文件夹。');
    }
    S.pack = JSON.parse(json);
    // 开场白挂在角色卡上、不是对话行，导出时单独存了一份。
    // 这里把它当成「第 0 章」插到最前面（旧版导出没有这个字段，不受影响）。
    if (S.pack.greeting && String(S.pack.greeting).trim()) {
      S.pack.sessions.unshift({
        sessionId: '（角色卡自带）', isGreeting: true, archives: [], messageCount: 1,
        dialogs: [{ role: 'assistant', content: [{ type: 'text', text: S.pack.greeting }] }],
      });
    }
    S.cur = i; S.cap = -1;
    renderList();
    // 上次读到哪就回到哪 —— 这个位置一直在存，但以前没人读它，等于白存
    let at = { cap: 0, page: 0 };
    try {
      const last = JSON.parse(localStorage.getItem('mufyReader.last') || '{}');
      if (last.name === S.pack.name && Number.isInteger(last.cap)
          && last.cap >= 0 && last.cap < S.pack.sessions.length) {
        at = { cap: last.cap, page: last.page || 0 };
      }
    } catch (e) {}
    openCap(at.cap, at.page);
    if (at.cap || at.page) toast('回到上次读到的地方');
  } catch (err) {
    $('title').textContent = c.name;
    $('page').innerHTML = `<h2>打不开</h2><div class="meta">${esc(c.key || c.name)}</div>
      <div class="body">${esc(err.message)}</div>`;
    toast('打不开：' + err.message, 3200);
  }
}

/* 把一段对话洗成「可以直接渲染的条目」，顺便数清楚藏了多少行脚手架。
   之所以要数：藏脚手架这个开关在大部分角色身上什么都不做（实测 200 多个角色里
   只有 20 来个真有这种行），不告诉你「这一段藏了几行」，你根本没法判断它有没有在工作。 */
function prepCap(s) {
  const hideSys = root.dataset.hidesys !== '0';
  const items = [];
  let dropped = 0;
  for (const m of s.dialogs || []) {
    let body = tidy(contentToText(m.content));
    if (hideSys) {
      dropped += countMachinery(body);
      body = dropMachinery(body);
    }
    if (!body) continue;
    items.push({ m, body });
  }
  return { items, dropped };
}

/* 分页：按「这一页大约多少字」切，而不是按条数切 ——
   RP 的一条可能是 80 字也可能是 3000 字，按条数切出来的页长短会差十几倍。 */
const PAGE_CHARS = { short: 2500, mid: 5000, long: 9000 };
function paginate(items) {
  if (S.mode !== 'page') return [items];
  const cap = PAGE_CHARS[$('ps') ? $('ps').value : 'mid'] || 5000;
  const out = []; let cur = [], n = 0;
  for (const it of items) {
    cur.push(it); n += it.body.length;
    if (n >= cap) { out.push(cur); cur = []; n = 0; }
  }
  if (cur.length) out.push(cur);
  return out.length ? out : [[]];
}

function openCap(j, page) {
  const p = S.pack; if (!p || !p.sessions[j]) return;
  S.cap = j;
  const s = p.sessions[j];
  $('title').textContent = `${p.name} · ${capTitle(s, j).replace(/^\d+\.\s*/, '')}`;

  const when = s.isGreeting
    ? '角色卡自带，不属于任何一段对话'
    : (s.archives && s.archives.length
        ? new Date(s.archives[0].createdAt).toLocaleString('zh-CN')
        : '未存档的最后一段');

  const { items, dropped } = prepCap(s);
  const pages = paginate(items);
  // page 传 -1 表示「要这一段的最后一页」（从后一段往回翻时用）
  S.page = page === -1 ? pages.length - 1 : Math.max(0, Math.min(page || 0, pages.length - 1));

  const parts = [
    `<h2>${esc(capTitle(s, j).replace(/^\d+\.\s*/, ''))}</h2>`,
    `<div class="meta">${esc(p.name)}　·　第 ${j + 1} / ${p.sessions.length} 段　·　${s.messageCount} 条　·　${esc(when)}`
      + (pages.length > 1 ? `　·　第 ${S.page + 1} / ${pages.length} 页` : '')
      + (dropped ? `　·　已藏 ${dropped} 行脚手架` : '')
      + `</div>`
  ];
  for (const it of pages[S.page]) {
    const me = it.m.role === 'user';
    const t = it.m.createdTime ? new Date(it.m.createdTime).toLocaleString('zh-CN') : '';
    parts.push(`<div class="msg ${me ? 'me' : 'ta'}">
      <div class="who">${me ? '我' : esc(p.name)}　${t}</div>
      <div class="body">${esc(it.body)}</div></div>`);
  }
  $('page').innerHTML = parts.join('');

  // 翻页按钮：本段还有页就翻页，翻到头了就滚到相邻的一段（像翻书那样连着）
  const lastPage = pages.length - 1;
  const hasPrev = S.page > 0 || j > 0;
  const hasNext = S.page < lastPage || j < p.sessions.length - 1;
  $('prev').disabled = !hasPrev;
  $('next').disabled = !hasNext;
  $('prev').textContent = S.page > 0 ? '← 上一页' : '← 上一段';
  $('next').textContent = S.page < lastPage ? '下一页 →' : '下一段 →';
  // 跳页：162 页的存档靠 ←/→ 一页页翻是不现实的，所以页码本身就是输入框。
  // 用 input 而不是 prompt()，手机上也点得动、不会被拦。
  if (pages.length > 1) {
    $('pgind').innerHTML = `第 <input id="pgjump" type="number" min="1" max="${pages.length}" ` +
      `value="${S.page + 1}" aria-label="跳到第几页"> / ${pages.length} 页`;
    const jump = $('pgjump');
    const go = () => {
      const n = Math.round(Number(jump.value));
      if (!Number.isFinite(n)) return;
      const t = Math.max(1, Math.min(n, pages.length));
      if (t - 1 !== S.page) openCap(S.cap, t - 1); else jump.value = t;
    };
    jump.onchange = go;
    jump.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); jump.blur(); go(); } };
    jump.onfocus = () => jump.select();
  } else {
    $('pgind').textContent = S.mode === 'page' ? '就这一页' : '';
  }

  $('main').scrollTop = 0;
  syncJumpers();
  renderList();
  localStorage.setItem('mufyReader.last', JSON.stringify({ name: p.name, cap: j, page: S.page }));
}

function goPrev() {
  if (S.page > 0) return openCap(S.cap, S.page - 1);
  if (S.cap > 0) return openCap(S.cap - 1, -1);     // 回到上一段的最后一页
}
function goNext() {
  const p = S.pack; if (!p) return;
  const pages = paginate(prepCap(p.sessions[S.cap]).items);
  if (S.page < pages.length - 1) return openCap(S.cap, S.page + 1);
  if (S.cap < p.sessions.length - 1) return openCap(S.cap + 1, 0);
}
$('prev').onclick = goPrev;
$('next').onclick = goNext;

/* ── 阅读设置 ── */
const root = document.documentElement;
let fs = 19;
document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
  fs = Math.max(14, Math.min(30, fs + (+b.dataset.fs)));
  root.style.setProperty('--fs', fs + 'px'); save();
});
$('lh').onchange = e => { root.style.setProperty('--lh', e.target.value); save(); };
$('cw').onchange = e => { root.style.setProperty('--cw', e.target.value + 'px'); save(); };
$('ff').onchange = e => { root.style.setProperty('--serif', e.target.value); save(); };
$('th').onchange = e => { root.dataset.theme = e.target.value; save(); };
$('hideme').onclick = () => {
  root.dataset.hideme = root.dataset.hideme === '1' ? '' : '1';
  $('hideme').textContent = root.dataset.hideme === '1' ? '显示我的发言' : '隐藏我的发言';
  save();
};
$('hidesys').onclick = () => {
  root.dataset.hidesys = root.dataset.hidesys === '0' ? '1' : '0';
  $('hidesys').textContent = root.dataset.hidesys === '0' ? '显示脚手架' : '已藏脚手架';
  save();
  if (S.cap >= 0) openCap(S.cap, S.page);
};
// 分页 / 滚动 切换：留在原来那一段，回到第一页
$('pg').onchange = e => { S.mode = e.target.value; save(); if (S.cap >= 0) openCap(S.cap, 0); };
$('ps').onchange = () => { save(); if (S.cap >= 0) openCap(S.cap, 0); };
$('toggle').onclick = () => $('side').classList.toggle('hide');

function save() {
  localStorage.setItem('mufyReader.prefs', JSON.stringify({
    fs, lh: $('lh').value, cw: $('cw').value, ff: $('ff').value,
    th: $('th').value, hideme: root.dataset.hideme || '',
    hidesys: root.dataset.hidesys || '1',
    pg: $('pg').value, ps: $('ps').value
  }));
}
(function load() {
  try {
    const p = JSON.parse(localStorage.getItem('mufyReader.prefs') || '{}');
    if (p.fs) { fs = p.fs; root.style.setProperty('--fs', fs + 'px'); }
    if (p.lh) { $('lh').value = p.lh; root.style.setProperty('--lh', p.lh); }
    if (p.cw) { $('cw').value = p.cw; root.style.setProperty('--cw', p.cw + 'px'); }
    if (p.ff) { $('ff').value = p.ff; root.style.setProperty('--serif', p.ff); }
    if (p.th) { $('th').value = p.th; root.dataset.theme = p.th; }
    if (p.hideme) { root.dataset.hideme = '1'; $('hideme').textContent = '显示我的发言'; }
    if (p.hidesys === '0') { root.dataset.hidesys = '0'; $('hidesys').textContent = '显示脚手架'; }
    if (p.pg) { $('pg').value = p.pg; S.mode = p.pg; }
    if (p.ps) { $('ps').value = p.ps; }
  } catch (e) {}
  bootFromCache();     // 有缓存就直接开，不用选文件
})();

/* 🔴 2026-08-10 改：这里原来写着「这个阅读器是给电脑用的」——**是我们在说反话**。
   实测（安卓用户 2026-08-10）：「选择文件夹」在手机上其实也点得动，
   只是 webkitdirectory 在手机上退化成普通文件选择器、**一次只挑得了一个**；
   而旁边那个「直接选 zip 文件（可多选）」一次就能把所有角色装进来。
   已经有用户自己摸索出来在手机上读了。别再劝退，把那条**更快的**路指出来。 */
(function mobileNotice() {
  const narrow = Math.min(screen.width, screen.height) < 700 ||
                 /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if (!narrow) return;
  const e = $('empty');
  if (!e) return;
  e.innerHTML = `<div style="max-width:26em">
    <b>手机上请点「直接选 zip 文件（可多选）」</b><br><br>
    在「文件」里<b>把所有角色的 zip 一次全选进来</b>，一步到位。<br>
    上面那个「选择存档文件夹」手机上<b>也点得动</b>，但手机的文件选择器
    一次只挑得了一个，几十个角色会点到崩溃 —— 别走那条。<br><br>
    <span style="opacity:.75">界面是按大屏排的，手机上会挤一点。
    想更舒服就用 <b>EPUB</b>：导出时「输出方式」直接选「每个角色一本电子书」，
    导进微信读书 / Apple Books 翻，目录、书签、进度都是原生的。</span>
  </div>`;
})();

/* 一键回顶 / 回底。长段一页能有近万字，滑到底再滑回来很折磨；
   分页模式下想去最后一页请用底部那个页码输入框，这两颗只管当前这一屏内容。 */
function scrollMain(to) {
  const m = $('main');
  m.scrollTo({ top: to === 'end' ? m.scrollHeight : 0, behavior: 'smooth' });
}
$('toTop').onclick = () => scrollMain('top');
$('toEnd').onclick = () => scrollMain('end');
function syncJumpers() {
  const m = $('main');
  // 内容不比屏幕高多少就别占地方了
  $('jumpers').classList.toggle('on', m.scrollHeight > m.clientHeight + 200);
}
$('main').addEventListener('scroll', syncJumpers, { passive: true });
addEventListener('resize', syncJumpers);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' && !$('next').disabled) goNext();
  if (e.key === 'ArrowLeft' && !$('prev').disabled) goPrev();
  if (e.key === 'Home') { e.preventDefault(); scrollMain('top'); }
  if (e.key === 'End') { e.preventDefault(); scrollMain('end'); }
  if (e.key === 'Escape') $('side').classList.toggle('hide');
});
</script>
</body>
