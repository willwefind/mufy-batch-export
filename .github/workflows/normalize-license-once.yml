name: Normalize AGPL license once

on:
  push:
    paths:
      - .github/workflows/normalize-license-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize repository licensing
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/spdx/license-list-data/main/text/AGPL-3.0-only.txt -o LICENSE
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '## License\n\nMIT。随便改随便传。',
              '## License\n\nGNU Affero General Public License v3.0（AGPL-3.0）。详见 [`LICENSE`](LICENSE)。'
          )
          readme.write_text(text, encoding='utf-8')

          script = Path('mufy-batch-export.user.js')
          text = script.read_text(encoding='utf-8')
          text = text.replace('// @license      MIT', '// @license      AGPL-3.0-only')
          script.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/normalize-license-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: normalize AGPL-3.0 licensing"
          git push
